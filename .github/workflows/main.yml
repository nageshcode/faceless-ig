name: Faceless IG Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run twice daily at 9 AM IST and 6 PM IST
    - cron: '30 3 * * *'
    - cron: '30 12 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir moviepy==2.1.1
          pip install --no-cache-dir imageio imageio-ffmpeg requests beautifulsoup4 gTTS Pillow tqdm

      - name: Confirm MoviePy installation
        run: |
          echo "=== Python Info ==="
          python --version
          echo "=== Checking MoviePy ==="
          python -c "import moviepy; print('✅ MoviePy version:', moviepy.__version__)"

      - name: Run automation
        run: python main.py

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="🤖 *Faceless IG Automation* finished with status: *${STATUS}*"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
