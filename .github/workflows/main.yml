name: Faceless IG Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run twice per day: 3:30 AM & 12:30 PM UTC = 9 AM & 6 PM IST
    - cron: '30 3 * * *'
    - cron: '30 12 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==2.1.1
          pip install imageio imageio-ffmpeg
          pip install requests beautifulsoup4 gTTS Pillow tqdm

      - name: Verify environment
        run: |
          echo "=== Python Info ==="
          python --version
          echo "=== Checking MoviePy ==="
          python -c "from moviepy.editor import VideoFileClip; print('✅ MoviePy working fine')"

      - name: Run automation
        run: python main.py
